// IndexedDB
const DB="elden-tracker-v7";
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("d");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);})}
async function dbL(){try{const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction("d","readonly");const s=t.objectStore("d");const r=s.get("s");r.onsuccess=()=>{const d=r.result;if(d){d.kills=d.kills||[];d.weapons=d.weapons||[];}ok(d||null);};r.onerror=()=>no(r.error);});}catch(e){return null;}}
async function dbS(d){try{const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction("d","readwrite");t.objectStore("d").put(d,"s");t.oncomplete=()=>ok();t.onerror=()=>no(t.error);});}catch(e){}}

function save(){if(saveT)clearTimeout(saveT);saveT=setTimeout(()=>dbS(S),300);}
function allBosses(){return B.concat(S&&S.customBosses?S.customBosses:[]);}
function gRun(){return S?.runs.find(r=>r.id===S.currentRunId)||null;}
function gBoss(){return S?allBosses().find(x=>x.id===S.currentBossId)||null:null;}
function rD(rid){return S.deaths.filter(d=>d.runId===rid);}
function rK(rid){return S.kills.filter(k=>k.runId===rid);}
function bD(rid,bid){return S.deaths.filter(d=>d.runId===rid&&d.bossId===bid);}
function bK(rid,bid){return S.kills.find(k=>k.runId===rid&&k.bossId===bid)||null;}
function getTimerMs(){const r=gRun();if(!r)return 0;const base=r.timerElapsed||0;return r.timerRunning&&r.timerLastStart?base+(Date.now()-r.timerLastStart):base;}
function toggleTimer(){const r=gRun();if(!r)return;if(r.timerRunning){r.timerElapsed=(r.timerElapsed||0)+(Date.now()-r.timerLastStart);r.timerRunning=false;r.timerLastStart=null;stopTI();}else{r.timerRunning=true;r.timerLastStart=Date.now();startTI();}save();updTimer();}
function resetTimer(){const r=gRun();if(!r)return;r.timerElapsed=0;r.timerRunning=false;r.timerLastStart=null;stopTI();save();updTimer();}
function startTI(){stopTI();timerIv=setInterval(updTimer,1000);}
function stopTI(){if(timerIv){clearInterval(timerIv);timerIv=null;}}
function updTimer(){const el=document.getElementById('tv');if(el)el.textContent=fmt(getTimerMs());const tb=document.getElementById('tt');if(tb){const r=gRun();if(r){tb.textContent=r.timerRunning?"\u23F8":"\u25B6";tb.className="timer-b"+(r.timerRunning?" on":"");}}}

function addDeath(phase){
  const run=gRun();if(!run)return;
  S.deaths.push({id:uid(),runId:S.currentRunId,bossId:S.currentBossId,timestamp:new Date().toISOString(),phase:phase||null});
  run.totalDeaths=(run.totalDeaths||0)+1;save();
  // Targeted DOM updates only
  const el1=document.getElementById('v-total');if(el1)el1.textContent=rD(run.id).length;
  const boss=gBoss();
  const el2=document.getElementById('v-boss');
  if(el2){const bd=boss?bD(S.currentRunId,boss.id).length:0;el2.textContent=boss?bd:"\u2014";el2.style.color=bd>0?"var(--bl)":"var(--ok)";}
  updPhase();
  // Flash the button that was clicked
  const btnId=phase?"pb"+phase:"death-main";
  const btn=document.getElementById(btnId);
  if(btn){btn.classList.add('flash');setTimeout(()=>btn.classList.remove('flash'),400);}
}
function undoDeath(){const r=gRun();if(!r)return;const rd=rD(S.currentRunId);if(!rd.length)return;const i=S.deaths.map(x=>x.runId).lastIndexOf(S.currentRunId);if(i!==-1){S.deaths.splice(i,1);r.totalDeaths=Math.max(0,(r.totalDeaths||1)-1);}save();render();}

S.kills.push({id:uid(),runId:S.currentRunId,bossId:S.currentBossId,level,weapon,deaths,firstTry:deaths===0,timestamp:new Date().toISOString()});if(weapon&&!S.weapons.includes(weapon))S.weapons.push(weapon);modal=null;save();render();}

h+='<div class="sg"><div class="sc"><div class="scl">Morts totales</div><div class="scv">'+S.deaths.length+'</div></div><div class="sc"><div class="scl">Boss battus</div><div class="scv" style="color:var(--ok)">'+S.kills.length+'</div></div><div class="sc"><div class="scl">First Try</div><div class="scv" style="color:#6fd06f">'+ftC+' \u2728</div></div><div class="sc"><div class="scl">Moy. / Boss</div><div class="scv">'+avg+'</div></div></div>';
// Phase stats
const phD=S.deaths.filter(function(d){return d.phase;});
if(phD.length>0){const p1=phD.filter(function(d){return d.phase===1;}).length;const p2=phD.filter(function(d){return d.phase===2;}).length;
h+='<div class="stit" style="font-size:14px;margin-top:24px">Morts par Phase</div><div class="sr"><div class="sb"><div class="sl">Phase 1</div><div class="sv" style="color:var(--bl)">'+p1+'</div><div style="font-size:11px;color:var(--td)">'+Math.round(p1/(p1+p2)*100)+'%</div></div><div class="sb"><div class="sl">Phase 2</div><div class="sv" style="color:var(--gold)">'+p2+'</div><div style="font-size:11px;color:var(--td)">'+Math.round(p2/(p1+p2)*100)+'%</div></div></div>';
}
// Ranking (always visible, no search filter)
const bbAll={};S.deaths.forEach(function(d){if(d.bossId)bbAll[d.bossId]=(bbAll[d.bossId]||0)+1;});
const sorted=Object.entries(bbAll).sort(function(a,b){return b[1]-a[1];});
if(sorted.length>0){const mx=sorted[0][1];
h+='<div class="stit" style="font-size:14px;margin-top:24px">Classement des boss les plus difficiles</div>';
sorted.slice(0,10).forEach(function(e,i){const id=e[0],cnt=e[1];
const kill=S.kills.find(function(k){return k.bossId===id;});const pct=Math.round((cnt/mx)*100);
h+='<div class="rr"><div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0"><span style="font-family:var(--fd);color:'+(i<5?'var(--gold)':'var(--tm)')+';font-size:13px;width:24px;text-align:right;flex-shrink:0">'+(i===0?'\uD83D\uDC51':'#'+(i+1))+'</span><span style="font-size:10px;margin-right:3px">'+ci(gB(id)?.c)+'</span><span style="color:var(--txt);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(bn(id))+'</span>'+(kill?'<span style="color:var(--ok);font-size:9px;flex-shrink:0">'+(kill.firstTry?'\u2728':'\u2705')+'</span>':'')+'</div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><div style="width:50px;height:6px;border-radius:3px;background:var(--sf2);overflow:hidden"><div style="height:100%;border-radius:3px;width:'+pct+'%;background:linear-gradient(90deg,var(--blood),var(--bl))"></div></div><span style="font-family:var(--fd);color:var(--bl);font-size:13px;width:28px;text-align:right">'+cnt+'</span></div></div>';
});}
// Boss battus (collapsible with search)
if(rk.length>0){
h+='<button onclick="statOpen=!statOpen;render()" style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding:0;background:none;border:none;cursor:pointer"><span class="stit" style="margin-bottom:0">Boss battus ('+rk.length+')</span><span style="color:var(--td);font-size:16px;transition:transform .2s;transform:rotate('+(statOpen?'180':'0')+'deg)">\u25BC</span></button>';
if(statOpen||statSrch){
h+='<input class="inp" id="statSrchInp" style="margin-top:12px" placeholder="Rechercher un boss battu..." value="'+esc(statSrch)+'" oninput="statSrch=this.value;updKillList()">';
h+='<div id="kill-list">';
h+=buildKillList();
h+='</div>';
}
}
}
h+='</div>';
}

h+='</main><nav>';
[{k:"run",i:"\u2694\uFE0F",l:"Run"},{k:"history",i:"\uD83D\uDCDC",l:"Historique"},{k:"stats",i:"\uD83D\uDCCA",l:"Stats"}].forEach(function(t){
h+='<button class="'+(tab===t.k?'on':'')+'" onclick="tab=\''+t.k+'\';render()"><span style="font-size:20px">'+t.i+'</span><span style="font-size:10px;letter-spacing:1px">'+t.l+'</span></button>';
});
h+='</nav>';
app.innerHTML=h;
if(modal)renderModal();
}

m+='<button class="bg" style="width:100%" onclick="var n=document.getElementById(\'addBossName\').value.trim();var z=document.getElementById(\'addBossZone\').value.trim();if(!n){alert(\'Nom requis\');return;}var c=document.getElementById(\'addT-m\').className.includes(\'on\')?\'m\':\'u\';addCustomBoss(n,z||\'Autre\',c)">Ajouter</button>';
m+='</div></div>';
}else if(modal&&modal.t==="renameBoss"){

}else if(modal==="settings"){

m+='<button class="bli" style="margin-bottom:8px" onclick="modal=null;exportJSON()"><span style="font-size:16px;margin-right:8px">\uD83D\uDCE6</span> Exporter les donn\u00E9es (JSON)</button>';

m+='<div style="text-align:center;margin-top:16px;font-size:10px;color:var(--tm)">Elden Ring Death Tracker v8<br>'+B.length+' boss \u2022 IndexedDB</div>';

function doConfirm(){if(!modal)return;if(modal.act==='resetRun')resetRun();else if(modal.act==='unKill')unKill();else if(modal.act==='delRun')delRun(modal.rid);else if(modal.act==='resetAll'){S=JSON.parse(JSON.stringify(DEF));modal=null;save();render();}}
function renderWpn(v){const dd=document.getElementById("wpdd");if(!dd)return;if(!v){dd.innerHTML='';return;}const f=(S.weapons||[]).filter(function(w){return w.toLowerCase().includes(v.toLowerCase());});if(!f.length){dd.innerHTML='';return;}dd.innerHTML='<div class="wpdd">'+f.slice(0,5).map(function(w){return'<button onclick="document.getElementById(\'kWpn\').value=\''+esc(w).replace(/'/g,"\\'")+'\';document.getElementById(\'wpdd\').innerHTML=\'\'">'+esc(w)+'</button>';}).join('')+'</div>';}
(async function(){const saved=await dbL();S=saved||JSON.parse(JSON.stringify(DEF));S.runs.forEach(function(r){if(r.timerElapsed===undefined){r.timerElapsed=0;r.timerRunning=false;r.timerLastStart=null;}});if(!S.customNames)S.customNames={};if(!S.customBosses)S.customBosses=[];render();})();
