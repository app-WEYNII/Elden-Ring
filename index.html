<style>

.lbl{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--tm);margin-bottom:6px}
.bg{padding:12px 24px;background:linear-gradient(135deg,var(--gd),var(--gold));color:var(--bg);border:none;border-radius:8px;font-family:var(--fd);font-size:13px;cursor:pointer;font-weight:600;letter-spacing:1px}
.bg:disabled{opacity:.4}.bs{padding:4px 10px;background:transparent;border:1px solid var(--brd);border-radius:6px;color:var(--td);font-size:11px;cursor:pointer}.bs.dg{border-color:var(--blood);color:var(--bl)}

.kb{background:rgba(58,122,58,.08);border:1px solid rgba(58,122,58,.25);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}

nav{display:flex;border-top:1px solid var(--brd);background:var(--sf);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,8px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 6px;background:transparent;border:none;cursor:pointer;font-family:var(--fb);color:var(--tm);border-top:2px solid transparent}
nav button.on{color:var(--gold);border-top-color:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:1000;animation:fadeIn .2s ease}
.mdl{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;padding:16px;border:1px solid var(--brd);border-bottom:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mt{font-family:var(--fd);color:var(--gold);font-size:16px}
.cb{background:transparent;border:none;color:var(--tm);font-size:18px;cursor:pointer;padding:4px 8px}
.zh{font-family:var(--fd);font-size:11px;color:var(--gd);letter-spacing:2px;text-transform:uppercase;padding:10px 4px 4px;border-bottom:1px solid rgba(42,42,58,.19);margin-bottom:4px}
.bli{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:transparent;border:1px solid var(--brd);border-radius:8px;cursor:pointer;margin-bottom:4px;color:var(--txt)}
.ctabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.ctab{padding:6px 10px;border-radius:20px;border:1px solid var(--brd);background:transparent;color:var(--td);font-size:11px;cursor:pointer;white-space:nowrap;font-family:var(--fb)}
.ctab.on{background:rgba(200,169,81,.12);border-color:var(--gold);color:var(--gold)}
.wpdd{position:absolute;left:0;right:0;top:100%;background:var(--sf);border:1px solid var(--brd);border-radius:8px;max-height:120px;overflow-y:auto;z-index:10}
.wpdd button{width:100%;padding:8px 12px;background:transparent;border:none;border-bottom:1px solid rgba(42,42,58,.19);color:var(--txt);font-size:13px;text-align:left;cursor:pointer}
.timer-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;margin-bottom:14px;background:var(--sf);border-radius:10px;border:1px solid var(--brd)}
.timer-d{font-family:var(--fd);font-size:22px;color:var(--gold);letter-spacing:2px;min-width:90px;text-align:center}
.timer-b{width:32px;height:32px;border-radius:50%;border:1px solid var(--brd);background:transparent;color:var(--td);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.timer-b.on{border-color:var(--ok);color:#6fd06f}
.phase-row{display:flex;gap:8px;margin-bottom:6px}
.phase-btn{flex:1;padding:16px 10px;border:2px solid var(--blood);border-radius:14px;background:radial-gradient(circle,var(--blood) 0%,#3a0d00 70%,var(--sf) 100%);color:#fff;cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none;transition:transform .15s,box-shadow .15s;box-shadow:0 0 20px rgba(139,37,0,.2)}
.phase-btn.flash{animation:pulse .4s ease;background:radial-gradient(circle,var(--bl) 0%,var(--blood) 60%,#2a0a00 100%)!important;box-shadow:0 0 50px rgba(196,60,28,.4)!important}
.zp{margin-bottom:8px}.zp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.zp-n{font-size:11px;color:var(--td);font-family:var(--fd);letter-spacing:1px}.zp-c{font-size:11px;color:var(--gold);font-family:var(--fd)}
.zp-bar{height:6px;background:var(--sf2);border-radius:3px;overflow:hidden}.zp-fill{height:100%;border-radius:3px;transition:width .3s}
</style>

<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div style="text-align:center"><div style="font-size:48px;margin-bottom:16px">⚔️</div><div style="font-family:var(--fd);color:var(--gold);font-size:18px">Chargement...</div></div></div></div>
<script>
const B=[
{id:"leg01",n:"Godrick le Greffé",z:"Nécrolimbe",c:"l",ph:2},
{id:"leg02",n:"Rennala, Reine de la Pleine Lune",z:"Liurnia, contrée lacustre",c:"l",ph:2},
{id:"leg03",n:"Radahn, le Fléau des Astres",z:"Caelid",c:"l",ph:2},
{id:"leg04",n:"Esprit ancestral royal",z:"Rivière Siofra",c:"l"},
{id:"leg05",n:"Rykard, Seigneur du Blasphème",z:"Plateau d'Altus",c:"l",ph:2},
{id:"leg06",n:"Astel, Naturenfant du Néant",z:"Rivière Ainsel",c:"l"},
{id:"leg07",n:"Mohg, Seigneur du Sang",z:"Palais de Mohgwyn",c:"l",ph:2},
{id:"leg08",n:"Morgott, Roi des Réprouvés",z:"Leyndell, capitale royale",c:"l",ph:2},
{id:"leg09",n:"Fortissax, la liche draconique",z:"Profondeurs de Fonderacine",c:"l"},
{id:"leg10",n:"Géant de feu",z:"Cimes des Géants",c:"l",ph:2},
{id:"leg11",n:"Placidusax, Seigneur-dragon",z:"Ruines de Farum Azula",c:"l",ph:2},
{id:"leg12",n:"Maliketh, la Lame noire",z:"Ruines de Farum Azula",c:"l",ph:2},
{id:"leg13",n:"Malenia, Lame de Miquella",z:"Arbre-Sacré de Miquella",c:"l",ph:2},
{id:"leg14",n:"Godfrey, Premier Seigneur d'Elden & Hoarah Loux",z:"Leyndell, capitale cendrée",c:"l",ph:2},
{id:"leg15",n:"Radagon de l'Ordre d'Or & Bête d'Elden",z:"Leyndell, capitale cendrée",c:"l",ph:2},
{id:"leg16",n:"Lion dansant de la Bête divine",z:"DLC — Plaines sépulcrales",c:"l",ph:2,dlc:true},
{id:"leg17",n:"Rellana, Chevaleresse des Lunes jumelles",z:"DLC — Plaines sépulcrales",c:"l",ph:2,dlc:true},
{id:"leg18",n:"Chevalier putrescent",z:"DLC — Fissure des cercueils",c:"l",ph:2,dlc:true},
{id:"leg19",n:"Avatar de l'Arbre-occulte",z:"DLC — Scadu Altus",c:"l",dlc:true},
{id:"leg19b",n:"Bayle l'Effroyable",z:"DLC — Pic Déchiqueté",c:"l",ph:2,dlc:true},
{id:"leg20",n:"Messmer l'Empaleur",z:"DLC — Scadu Altus",c:"l",ph:2,dlc:true},
{id:"leg21",n:"Romina, Sainte du Bourgeon",z:"DLC — Ruines de Rauh",c:"l",dlc:true},
{id:"leg22",n:"Metyr, Mère des Doigts",z:"DLC — Scadu Altus",c:"l",ph:2,dlc:true},
{id:"leg23",n:"Commandant Gaïus",z:"DLC — Scadu Altus",c:"l",dlc:true},
{id:"leg24",n:"Midra, Seigneur de la Flamme frénétique",z:"DLC — Bois Abyssaux",c:"l",ph:2,dlc:true},
{id:"leg25",n:"Radahn, Futur Consort",z:"DLC — Enir Ilim",c:"l",ph:2,dlc:true}
];

const CAT={l:{l:"Légendaire",i:"\u{1F451}"},b:{l:"Boss",i:"\u2694\uFE0F"},u:{l:"Unique",i:"\u{1F6E1}\uFE0F"},i:{l:"Invasion",i:"\u{1F5E1}\uFE0F"}};
const ZONES=[...new Set(B.map(b=>b.z))];
// Liste complète des zones du jeu pour le dropdown d'ajout/modification
const ZONES_ALL=[
"Nécrolimbe",
"Péninsule Larmoyante",
"Château de Voilorage",
"Liurnia, contrée lacustre",
"Académie de Raya Lucaria",
"Caelid",
"Dragonbarrow",
"Plateau d'Altus",
"Mont Gelmir",
"Manoir du Volcan",
"Leyndell, capitale royale",
"Leyndell, capitale cendrée",
"Bastion de la Table ronde",
"Cimes des Géants",
"Champs enneigés consacrés",
"Arbre-Sacré de Miquella",
"Ruines de Farum Azula",
"Rivière Siofra",
"Nokron, ville éternelle",
"Rivière Ainsel",
"Nokstella, cité éternelle",
"Profondeurs de Fonderacine",
"Palais de Mohgwyn",
"Lac putréfié",
"DLC — Plaines sépulcrales",
"DLC — Côte Azurée",
"DLC — Fissure des cercueils",
"DLC — Scadu Altus",
"DLC — Ruines de Rauh",
"DLC — Bois Abyssaux",
"DLC — Pic Déchiqueté",
"DLC — Enir Ilim",
"Autre"
];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const gB=id=>{var b=B.find(x=>x.id===id);if(!b&&S&&S.customBosses)b=S.customBosses.find(x=>x.id===id);return b||null;};
const bn=id=>{if(S&&S.customNames&&S.customNames[id])return S.customNames[id];const b=gB(id);return b?b.n:"Inconnu";};
const ci=c=>CAT[c]?CAT[c].i:"";
const fmt=ms=>{const s=Math.floor(ms/1000);const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=s%60;return h>0?h+":"+String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0'):m+":"+String(sec).padStart(2,'0');};

// IndexedDB
const DB="elden-tracker-v7";
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("d");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);})}
async function dbL(){try{const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction("d","readonly");const s=t.objectStore("d");const r=s.get("s");r.onsuccess=()=>{const d=r.result;if(d){d.kills=d.kills||[];d.weapons=d.weapons||[];}ok(d||null);};r.onerror=()=>no(r.error);});}catch(e){return null;}}
async function dbS(d){try{const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction("d","readwrite");t.objectStore("d").put(d,"s");t.oncomplete=()=>ok();t.onerror=()=>no(t.error);});}catch(e){}}

let S=null,tab="run",bSrch="",bCat="all",modal=null,saveT=null,timerIv=null,statSrch="",statOpen=false;
const DEF={runs:[],deaths:[],kills:[],currentRunId:null,currentBossId:null,weapons:[],customNames:{},customBosses:[]};

function save(){if(saveT)clearTimeout(saveT);saveT=setTimeout(()=>dbS(S),300);}
function allBosses(){return B.concat(S&&S.customBosses?S.customBosses:[]);}
function gRun(){return S?.runs.find(r=>r.id===S.currentRunId)||null;}
function gBoss(){return S?allBosses().find(x=>x.id===S.currentBossId)||null:null;}
function rD(rid){return S.deaths.filter(d=>d.runId===rid);}
function rK(rid){return S.kills.filter(k=>k.runId===rid);}
function bD(rid,bid){return S.deaths.filter(d=>d.runId===rid&&d.bossId===bid);}
function bK(rid,bid){return S.kills.find(k=>k.runId===rid&&k.bossId===bid)||null;}
function getTimerMs(){const r=gRun();if(!r)return 0;const base=r.timerElapsed||0;return r.timerRunning&&r.timerLastStart?base+(Date.now()-r.timerLastStart):base;}
function toggleTimer(){const r=gRun();if(!r)return;if(r.timerRunning){r.timerElapsed=(r.timerElapsed||0)+(Date.now()-r.timerLastStart);r.timerRunning=false;r.timerLastStart=null;stopTI();}else{r.timerRunning=true;r.timerLastStart=Date.now();startTI();}save();updTimer();}
function resetTimer(){const r=gRun();if(!r)return;r.timerElapsed=0;r.timerRunning=false;r.timerLastStart=null;stopTI();save();updTimer();}
function startTI(){stopTI();timerIv=setInterval(updTimer,1000);}
function stopTI(){if(timerIv){clearInterval(timerIv);timerIv=null;}}
function updTimer(){const el=document.getElementById('tv');if(el)el.textContent=fmt(getTimerMs());const tb=document.getElementById('tt');if(tb){const r=gRun();if(r){tb.textContent=r.timerRunning?"\u23F8":"\u25B6";tb.className="timer-b"+(r.timerRunning?" on":"");}}}

function addDeath(phase){
  const run=gRun();if(!run)return;
  S.deaths.push({id:uid(),runId:S.currentRunId,bossId:S.currentBossId,timestamp:new Date().toISOString(),phase:phase||null});
  run.totalDeaths=(run.totalDeaths||0)+1;save();
  // Targeted DOM updates only
  const el1=document.getElementById('v-total');if(el1)el1.textContent=rD(run.id).length;
  const boss=gBoss();
  const el2=document.getElementById('v-boss');
  if(el2){const bd=boss?bD(S.currentRunId,boss.id).length:0;el2.textContent=boss?bd:"\u2014";el2.style.color=bd>0?"var(--bl)":"var(--ok)";}
  updPhase();
  // Flash the button that was clicked
  const btnId=phase?"pb"+phase:"death-main";
  const btn=document.getElementById(btnId);
  if(btn){btn.classList.add('flash');setTimeout(()=>btn.classList.remove('flash'),400);}
}
function undoDeath(){const r=gRun();if(!r)return;const rd=rD(S.currentRunId);if(!rd.length)return;const i=S.deaths.map(x=>x.runId).lastIndexOf(S.currentRunId);if(i!==-1){S.deaths.splice(i,1);r.totalDeaths=Math.max(0,(r.totalDeaths||1)-1);}save();render();}
function createRun(name){const id=uid();S.runs.push({id,name,date:new Date().toISOString(),totalDeaths:0,timerElapsed:0,timerRunning:false,timerLastStart:null});S.currentRunId=id;S.currentBossId=null;modal=null;save();render();}
function selRun(id){S.currentRunId=id;modal=null;tab="run";stopTI();const r=gRun();if(r?.timerRunning)startTI();save();render();}
function selBoss(id){
  // Reset boss timer when changing boss
  const run=gRun();
  if(run){run.timerElapsed=0;run.timerRunning=false;run.timerLastStart=null;stopTI();}
  S.currentBossId=id;modal=null;bSrch="";bCat="all";save();render();
}
function resetRun(){const r=gRun();if(!r)return;S.deaths=S.deaths.filter(x=>x.runId!==S.currentRunId);S.kills=S.kills.filter(x=>x.runId!==S.currentRunId);r.totalDeaths=0;r.timerElapsed=0;r.timerRunning=false;r.timerLastStart=null;stopTI();modal=null;save();render();}
function delRun(rid){S.runs=S.runs.filter(r=>r.id!==rid);S.deaths=S.deaths.filter(x=>x.runId!==rid);S.kills=S.kills.filter(x=>x.runId!==rid);if(S.currentRunId===rid){S.currentRunId=S.runs.length?S.runs[S.runs.length-1].id:null;stopTI();}modal=null;save();render();}
function confirmKill(level){const run=gRun(),boss=gBoss();if(!run||!boss)return;S.kills=S.kills.filter(k=>!(k.runId===S.currentRunId&&k.bossId===S.currentBossId));const deaths=bD(S.currentRunId,S.currentBossId).length;
S.kills.push({id:uid(),runId:S.currentRunId,bossId:S.currentBossId,level,deaths,firstTry:deaths===0,timestamp:new Date().toISOString()});modal=null;save();render();}
function unKill(){S.kills=S.kills.filter(k=>!(k.runId===S.currentRunId&&k.bossId===S.currentBossId));modal=null;save();render();}
function exportJSON(){if(!S)return;const j=JSON.stringify(S,null,2);const a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(j);a.download="elden-tracker-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);}
